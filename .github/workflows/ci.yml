name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verifikasi HTML sinkron dengan partial
        run: npm run build:check
      - name: Validasi tautan internal
        run: npm run check:links
      - name: Validasi HTML
        run: npm run check:html
      - name: Pasang Chromium untuk Playwright
        run: npx playwright install --with-deps chromium
      - name: Jalankan server statis
        run: npx http-server -p 4173 -c-1 &
      - name: Smoke test
        run: |
          sleep 2
          npm run smoke
